
name: Build NEXUS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build web app
        run: npm run build -w client
        env:
          VITE_API_URL: https://nexus-server-ooto.onrender.com

      - name: Install Capacitor Android
        run: npm install @capacitor/android@6.2.0 -w client

      - name: Add Android platform
        run: npx cap add android
        working-directory: client

      - name: Sync Android
        run: npx cap sync android
        working-directory: client

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: client

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          
